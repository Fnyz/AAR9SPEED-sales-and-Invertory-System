name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l > lint.log || { grep -v "^No syntax errors" lint.log; exit 1; }
          echo "$(wc -l < lint.log) files OK"

  smoke:
    name: Smoke test (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aar9speed
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ADMIN_TEST_PASSWORD: ci-smoke-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql
          coverage: none
      - name: Import schema and migrations
        run: |
          for f in aar9speed.sql migrations/002_improvements.sql migrations/003_automation.sql migrations/005_widen_contact_fields.sql migrations/006_payment_method.sql; do
            mysql -h127.0.0.1 -uroot -proot aar9speed < "$f"
          done
      - name: Configure app
        run: |
          printf 'DB_HOST=127.0.0.1\nDB_USER=root\nDB_PASS=root\nDB_NAME=aar9speed\nLOW_STOCK_THRESHOLD=5\n' > .env
          php migrations/004_hash_passwords.php
          HASH=$(php -r 'echo password_hash(getenv("ADMIN_TEST_PASSWORD"), PASSWORD_DEFAULT);')
          mysql -h127.0.0.1 -uroot -proot aar9speed -e "UPDATE staff SET staff_pass = '$HASH' WHERE STAFF_USER = 'admin'"
      - name: Start PHP server
        run: |
          php -d display_errors=1 -d error_reporting=E_ALL -S 127.0.0.1:8000 > server.log 2>&1 &
          sleep 1
      - name: Run smoke test
        run: bash tests/smoke.sh http://127.0.0.1:8000 admin "$ADMIN_TEST_PASSWORD"
      - name: Server log
        if: failure()
        run: cat server.log

  deploy:
    name: Deploy to hosting (FTP)
    needs: [lint, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production-deploy
    steps:
      - name: Check FTP settings
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP_SERVER secret is not set; skipping deploy. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Upload changed files
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'htdocs/' }}
          # Never upload secrets, the database dump or dev files, and never touch
          # the photos staff uploaded on the server (images/).
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .serena/**
            .env
            .env.*
            aar9speed.sql
            migrations/**
            tests/**
            docs/**
            README.md
            .php-cs-fixer.cache
            **/.DS_Store
            images/**
